name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: extractions/setup-just@v1
    - uses: actions/checkout@v3
    - name: Setup
      run: just install_deps
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: just test
