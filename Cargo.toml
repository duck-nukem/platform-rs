[package]
name = "platform-rs"
version = "0.2.0"
edition = "2021"
authors = ["Alex Szabo <kreatemore@gmail.com>"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[lints.clippy]
complexity   = { priority = -1, level = "deny" }
correctness  = { priority = -1, level = "deny" }
nursery      = { priority = -1, level = "deny" }
pedantic     = { priority = -1, level = "deny" }
perf         = { priority = -1, level = "deny" }
style        = { priority = -1, level = "deny" }
suspicious   = { priority = -1, level = "deny" }

unwrap-used     = "deny"
expect-used     = "deny"
redundant-clone = "deny"

[dependencies]
axum = "0.6.20"
axum-login = { version = "0.5.0", features = ["postgres"] }
bcrypt = "0.15.0"
bincode = "1.3.3"
chrono = "0.4.30"
dotenv = "0.15.0"
rand = { version = "0.8.5", features = ["min_const_gen"] }
rust-i18n = "3"
sailfish = "0.8.0"
serde = { version = "1.0.183", features = ["derive", "std"] }
sqlx = { version = "0.6.3", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["limit"]}
tower-http = { version = "0.4.3", features = ["trace", "compression-br", "compression-gzip", "compression-deflate", "tower"] }
tower-request-id = "0.2.1"
tracing = { version = "0.1", features = ["tracing-attributes", "attributes"] }
tracing-opentelemetry = "0.20.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
opentelemetry = { version = "0.19.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version="0.12.0",  features = ["tonic", "metrics"] }
opentelemetry-semantic-conventions = { version="0.11.0" }
once_cell = "1.20.2"

[dev-dependencies]
axum-test = "12.1.0"
