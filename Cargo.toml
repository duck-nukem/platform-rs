[package]
name = "platform-rs"
version = "0.1.0"
edition = "2018"

[dependencies]
axum = "0.6.20"
axum-login = { version = "0.5.0", features = ["postgres"] }
bcrypt = "0.15.0"
bincode = "1.3.3"
dotenv = "0.15.0"
opentelemetry = { version = "*", features = ["rt-tokio"] }
opentelemetry-jaeger = { version = "*", features = ["rt-tokio"] }
rand = { version = "0.8.5", features = ["min_const_gen"] }
rust-i18n = { version = "2.1.0", features = ["rust-i18n-extract"] }
sailfish = "0.8.0"
serde = { version = "1.0.183", features = ["derive", "std"] }
sqlx = { version = "0.6.3", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.4.3", features = ["trace", "compression-br", "compression-gzip", "compression-deflate"] }
tower-request-id = "0.2.1"
tracing = { version = "0.1", features = ["tracing-attributes", "attributes"] }
tracing-opentelemetry = "0.20.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }

[dev-dependencies]
axum-test = "12.1.0"